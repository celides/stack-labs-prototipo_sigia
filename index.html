  if(/letra (mas )?grande|aumenta(r)? (la )?letra/.test(n)){S.fs=Math.min(2,(S.fs||1)+.1);save();applyUI();return 1}
  if(/letra (mas )?(chica|pequena)|reduce(r)? (la )?letra/.test(n)){S.fs=Math.max(.8,(S.fs||1)-.1);save();applyUI();return 1}
  if(/modo oscuro/.test(n)){S.theme='dark';save();applyUI();return 1}
  if(/modo claro/.test(n)){S.theme='light';save();applyUI();return 1}
  if(/^(lee|leer|escucha|escuchar) (la )?(pantalla|todo)/.test(n)){say($('#main').innerText);return 1}
  if(/^(para|parar|detener|silencio|alto)$/.test(n)){speechSynthesis.cancel();return 1}

}

views.simulacro=()=>`<h1>Simulacro de auditoría</h1><p class="sub">El sistema pregunta por voz si existe cada registro. Responde Sí o No.</p><div class="card" id="sim"><button class="mbtn" data-a2="simgo">Iniciar (8 preguntas)</button></div>`;
function simQ(){const c=pick(ALL.filter(x=>x.regs.length)),r=pick(c.regs),q=`Cláusula ${c.code}, ${c.title}. ¿Cuenta con ${r}?`;SIM.cur={c,r};$('#sim').innerHTML=`<p><b>${SIM.n+1} / 8</b></p><p style="font-size:1.2em">${esc(q)}</p><div class="tools o"><button class="mbtn" data-a2="simy">Sí</button><button class="mbtn" data-a2="simn">No</button><button class="mbtn" data-a2="simr">🔊 Repetir</button></div>`;say(q)}
function simEnd(){const g=[...new Set(SIM.gaps.map(x=>x.c.code))];$('#sim').innerHTML=`<h3>${SIM.si} de 8 con evidencia</h3>${SIM.gaps.map(x=>`<p>• ${x.c.code} · ${esc(x.r)}</p>`).join('')||'<p>Sin pendientes.</p>'}<div class="tools o">${g.length?'<button class="mbtn" data-a2="simadd">Agregar pendientes al informe</button>':''}<button class="mbtn" data-a2="simgo">Otra ronda</button></div>`;say(`Resultado: ${SIM.si} de 8 con evidencia.`)}
/* ajustes */
views.ajustes=()=>{const a=S.aut,vs=('speechSynthesis' in window?speechSynthesis.getVoices():[]).filter(v=>v.lang.startsWith((S.rl||'es-MX').slice(0,2))),au=(k,l,ph='')=>`<label>${l}<input data-au="${k}" value="${esc(a[k])}" placeholder="${ph}"></label>`;
return`<h1>Ajustes</h1><p class="sub">Todo se guarda en este dispositivo.</p><div class="ed">
<div class="card"><h3>Mi perfil</h3><p class="sub">Escribe tu nombre y título como quieras que salgan. Lo que dejes vacío no aparece en los documentos.</p><div class="two">${au('tit','Título o tratamiento','Ing., Lic., Auditor…')}${au('n','Nombre completo')}${au('c','Cargo')}${au('des','Despacho o empresa')}${au('dir','Dirección')}${au('tel','Teléfono')}${au('mail','Correo electrónico')}${au('web','Sitio web')}${au('cert','Certificaciones o registro')}</div><div class="tools o" style="margin-top:8px"><label class="mbtn" for="firma">🖊 Subir firma</label><input type="file" id="firma" accept="image/*" hidden>${a.firma?`<img src="${a.firma}" style="max-height:50px;background:#fff"><button class="mbtn" data-a2="firmadel">Quitar firma</button>`:''}</div></div>
<div class="card"><h3>Apariencia</h3><label>Tamaño de letra: ${Math.round((S.fs||1)*100)}%<input type="range" min=".8" max="2" step=".1" value="${S.fs||1}" data-s="fs"></label><div class="two"><label>Tema<select data-s="theme">${[['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(([k,l])=>`<option value="${k}" ${(S.theme||'auto')===k?'selected':''}>${l}</option>`).join('')}</select></label><label>Idioma de la pantalla<select data-s="ui"><option value="es">Español</option><option value="en" ${S.ui==='en'?'selected':''}>English</option></select></label></div><div style="margin-top:8px">${[['','Bosque'],['azul','Azul'],['vino','Vino'],['grafito','Grafito'],['ambar','Ámbar'],['alto','Alto contraste']].map(([k,l])=>`<button class="chip" data-a2="skin:${k}" ${(S.skin||'')===k?'style="background:var(--acc);color:var(--on-acc)"':''}>${l}</button>`).join('')}</div><label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" data-s="help" ${S.help?'checked':''}> Modo principiante (explica cada pantalla)</label></div>
<div class="card"><h3>Voz</h3><div class="two"><label>Idioma de lectura<select data-s="rl">${LANGS2.map(([k,l])=>`<option value="${k}" ${(S.rl||'es-MX')===k?'selected':''}>${l}</option>`).join('')}</select></label><label>Voz<select data-s="voice"><option value="">Automática</option>${vs.map(v=>`<option ${S.voice===v.name?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label></div><p class="sub">Las voces disponibles dependen de tu dispositivo.</p></div>
<div class="card"><h3>Datos y respaldo</h3><p id="pst" class="sub"></p><div class="tools o"><button class="mbtn" data-a2="protect">🛡 Proteger mis datos</button><button class="mbtn" data-a2="zip">Respaldo completo (.zip)</button><button class="mbtn" data-a2="zips">Compartir respaldo</button><label class="mbtn" for="zipin">Restaurar respaldo</label><input type="file" id="zipin" accept=".zip" hidden><a class="mbtn" href="#/papelera">Papelera</a></div><p class="sub">Último respaldo: ${S.lastBak?new Date(S.lastBak).toLocaleString():'nunca'}</p></div></div>`};
/* inicio: pendientes y respaldo */
const _ini=views.inicio;
views.inicio=()=>{
  const hoy=new Date().toLocaleDateString('sv-SE'),p=S.inf.it.filter(x=>x.lim&&['m','M','C'].includes(x.st)).map(x=>({...x,d:Math.round((new Date(x.lim)-new Date(hoy))/864e5)})).filter(x=>x.d<=14).sort((a,b)=>a.d-b.d),bak=!S.lastBak||Date.now()-S.lastBak>6048e5;
  return _ini()+`<div class="card"><h3>Pendientes</h3>${bak?'<p>⚠️ Hace más de 7 días sin respaldo. <button class="lnk" data-a2="zip">Respaldar ahora</button></p>':''}${p.length?p.map(x=>`<p>${x.d<0?'🔴 Vencida':'🟡 Por vencer'} · ${x.code} · ${esc(x.rec||x.txt).slice(0,90)} (${fdate(x.lim)})</p>`).join('')+'<button class="mbtn" data-a2="readvenc">🔊 Leer pendientes</button>':'<p>No hay acciones por vencer.</p>'}</div>`;
};
/* route con ayuda, listas asíncronas e idioma */
removeEventListener('hashchange',route);
const _route=route;
route=function(){
  _route();const id=location.hash.slice(2)||'inicio',m=$('#main');
  if(HELP[id])m.insertAdjacentHTML('afterbegin',`<div class="help"><b>${S.ui==='en'?'How this works':'Cómo funciona'}:</b> ${HELP[id][S.ui==='en'?1:0]} <button class="mbtn" data-a2="readhelp">🔊</button></div>`);
  if(id==='docs')listDocs();if(id==='papelera')listTrash();
  if(id==='ajustes')navigator.storage?.persisted?.().then(p=>{const el=$('#pst');if(el)el.textContent=p?'🛡 Almacenamiento protegido por el navegador.':'⚠️ El navegador aún no protege tus datos. Toca «Proteger», instala la app en la pantalla de inicio y haz respaldos.'});
  trDOM();
};
addEventListener('hashchange',()=>route());
/* eventos */
document.addEventListener('change',async e=>{
  const i=e.target,f=i.files&&i.files[0];if(!f)return;
  if(i.id==='firma'){const im=new Image();im.onload=()=>{const k=Math.min(1,400/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.aut.firma=c.toDataURL('image/png');save();route()};im.src=URL.createObjectURL(f)}
  if(i.id==='zipin'){if(confirm('Se combinará el respaldo con los datos actuales y se reiniciará la pantalla. ¿Continuar?'))impZip(f).catch(()=>say$('No pude leer ese respaldo.'))}
},true);
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.au!==undefined){S.aut[d.au]=t.value;save()}
  else if(d.ct){const[i,k]=d.ct.split('|'),x=emp();if(x.ct&&x.ct[i]){x.ct[i][k]=t.value;save()}}
  else if(d.cf){const[i,k]=d.cf.split('|'),x=emp();if(x.cf&&x.cf[i]){x.cf[i][k]=t.value;save()}}
  else if(d.s){S[d.s]=d.s==='fs'?+t.value:t.type==='checkbox'?(t.checked?1:0):t.value;save();if(d.s==='ui')return location.reload();if(d.s==='rl')return route();applyUI()}
  else if(t.id==='paper'&&S.inf.free){S.inf.free=t.innerHTML;save()}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a2]');if(!b)return;const a=b.dataset.a2,id=b.dataset.id,I=S.inf,x=emp();
  if(a.startsWith('cmd|')){const[,c,v]=a.split('|');document.execCommand(c,false,v||null);return}
  if(a.startsWith('skin:')){S.skin=a.slice(5);save();applyUI();return route()}
  const A={
    'fs-':()=>{S.fs=Math.max(.8,(S.fs||1)-.1);save();applyUI()},'fs+':()=>{S.fs=Math.min(2,(S.fs||1)+.1);save();applyUI()},
    theme:()=>{S.theme={auto:'dark',dark:'light',light:'auto'}[S.theme||'auto'];save();applyUI();say$('Tema: '+S.theme)},
    help:()=>{S.help=S.help?0:1;save();applyUI()},readscr:()=>say($('#main').innerText),vcmd:listenCmd,
    readhelp:()=>say(b.closest('.help').innerText),readvenc:()=>say(b.closest('.card').innerText),
    ctadd:()=>{(x.ct=x.ct||[]).push({n:'',p:'',m:'',t:''});save();route()},ctdel:()=>{x.ct.splice(+id,1);save();route()},
    cfadd:()=>{(x.cf=x.cf||[]).push({k:'',v:''});save();route()},cfdel:()=>{x.cf.splice(+id,1);save();route()},
    empdel2:async()=>{if(!confirm('¿Mover esta empresa a la papelera?'))return;await fPut('trash:'+Date.now()+':emp',{kind:'emp',emp:x,at:Date.now()});S.emp=S.emp.filter(y=>y.id!==x.id);I.emp='';save();route()},
    docopen:async()=>{const r=await fGet(id);S.inf=r.inf;S.inf.rid=id;save();location.hash='#/informe'},
    docshare:async()=>outDoc(clean((await fGet(id)).html),'Informe-SIGIA',true),
    docdel:async()=>{if(confirm('¿Mover a la papelera?')){await toTrash(id);route()}},
    trrest:async()=>{const v=await fGet(id);if(v.kind==='emp')S.emp.push(v.emp),save();else{const{kind,key,at,...r}=v;await fPut(key,r);if(kind==='file')have.add(key)}await fDel(id);route()},
    trdel:async()=>{if(confirm('Se eliminará para siempre. ¿Continuar?')){await fDel(id);route()}},
    trempty:async()=>{if(!confirm('Se vaciará la papelera para siempre. ¿Continuar?'))return;for(const k of await fKeys())if(String(k).startsWith('trash:'))await fDel(k);route()},
    docx:()=>outDoc(paperHTML(),repName(),false),share2:()=>outDoc(paperHTML(),repName(),true),
    free:()=>{if(I.free){if(!confirm('Volver al modo automático borra tus ediciones libres. ¿Continuar?'))return;I.free=''}else I.free=paperHTML();save();route()},
    newrep:()=>{if(!confirm('¿Empezar un informe nuevo? El actual queda guardado en Documentos.'))return;Object.assign(I,{it:[],notas:'',folio:'',para:'',cc:'',free:'',rid:''});SUG=[];save();route()},
    zip:()=>expZip(false),zips:()=>expZip(true),
    protect:async()=>{if(!navigator.storage?.persist)return say$('Este navegador no permite proteger el almacenamiento.');const ok=await navigator.storage.persist();say$(ok?'Almacenamiento protegido ✓':'El navegador no lo concedió. Instala la app (añadir a pantalla de inicio) y haz respaldos.');route()},
    firmadel:()=>{S.aut.firma='';save();route()},
    simgo:()=>{SIM={n:0,si:0,gaps:[]};simQ()},simr:()=>say(`Cláusula ${SIM.cur.c.code}, ${SIM.cur.c.title}. ¿Cuenta con ${SIM.cur.r}?`),
    simy:()=>{SIM.si++;SIM.n++;SIM.n>=8?simEnd():simQ()},simn:()=>{SIM.gaps.push(SIM.cur);SIM.n++;SIM.n>=8?simEnd():simQ()},
    simadd:()=>{SIM.gaps.forEach(g=>addIt(g.c.code));sortIt();save();location.hash='#/informe'}
  };
  if(A[a])A[a]();
});
fKeys().then(async k=>{const d=x=>String(x).startsWith('doc:');have=new Set(k.filter(x=>!d(x)));for(const x of k.filter(d))IMP.push(await fGet(x));route()}).catch(route);
</script>
</body>
</html>
