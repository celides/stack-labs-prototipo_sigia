<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SIGIA · Sistema de gestión de inocuidad alimentaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:light-dark(#edf0ee,#0e1513);--panel:light-dark(#fff,#16201d);--ink:light-dark(#14211e,#e6efeb);
  --mute:light-dark(#5b6b66,#93a39d);--line:light-dark(#d5dcd9,#25322e);
  --acc:light-dark(#0b6b4d,#4fd1a1);--on-acc:light-dark(#fff,#06231a);--warn:light-dark(#b45309,#f2b24c);
  --rail:#10302a;--r:10px;
  --f1:'Familjen Grotesk',system-ui,sans-serif;--f2:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font:400 15px/1.55 var(--f2);background:var(--bg);color:var(--ink);min-height:100dvh}
h1,h2,h3,b{font-family:var(--f1)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:360px 1fr;min-height:100dvh}
.rail{background:var(--rail);color:#e6efeb;padding:20px 18px;position:sticky;top:0;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{font:700 26px var(--f1);letter-spacing:-.02em}
.brand small{display:block;font:400 12px var(--f2);opacity:.65;letter-spacing:0}
.rail nav{display:flex;gap:6px;flex-wrap:wrap}
.rail nav a{color:#cfe0da;text-decoration:none;padding:6px 11px;border-radius:99px;font-size:13px;border:1px solid #ffffff26}
.rail nav a[aria-current=page]{background:#e6efeb;color:#10302a;border-color:transparent;font-weight:600}
.asst{background:#0a211d;border:1px solid #ffffff1f;border-radius:14px;padding:14px;display:grid;gap:10px}
.asst h2{font-size:15px}
textarea{width:100%;min-height:74px;resize:vertical;border-radius:8px;border:1px solid #ffffff2e;background:#0e2b26;color:#fff;padding:10px;font:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mic{width:64px;height:64px;border-radius:50%;border:0;background:#4fd1a1;color:#06231a;font-weight:700;font-size:13px}
.mic.on{background:#ef4444;color:#fff;animation:p 1.2s infinite}
@keyframes p{50%{box-shadow:0 0 0 12px #ef444433}}
@media(prefers-reduced-motion:reduce){.mic.on{animation:none}}
.rail .btn{background:#ffffff14;border:1px solid #ffffff2e;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px}
.rail .btn.pri{background:#4fd1a1;color:#06231a;border-color:transparent;font-weight:600}
.ans{font-size:13.5px;display:grid;gap:8px;max-height:34dvh;overflow-y:auto}
.ans div{background:#ffffff0f;border-radius:8px;padding:9px 10px}
.ans button{margin-top:6px}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;font-size:12px;align-items:center}
.ctl input{accent-color:#4fd1a1;width:100%}
.legal{font-size:11.5px;opacity:.7;margin-top:auto}
#st{font-size:12px;min-height:16px;opacity:.85}
main{padding:28px clamp(16px,3vw,40px);max-width:1000px;width:100%}
main h1{font-size:30px;letter-spacing:-.02em;margin-bottom:4px}
.sub{color:var(--mute);margin-bottom:22px}
.big{font:700 clamp(56px,9vw,96px)/1 var(--f1);letter-spacing:-.04em;color:var(--acc)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card h3{font-size:16px;margin-bottom:8px}
.pend a,.card a{color:var(--acc)}
.pend button,.lnk{background:none;border:0;color:var(--acc);text-decoration:underline;padding:0}
.pend p{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
#f{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;margin-bottom:14px}
details{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
summary{display:grid;grid-template-columns:76px 1fr auto;gap:10px;padding:12px 14px;cursor:pointer;list-style:none;align-items:center}
summary::-webkit-details-marker{display:none}
summary b{color:var(--acc)}
summary em{font-style:normal;font-size:13px;color:var(--mute)}
details[open] summary{border-bottom:1px solid var(--line)}
.obs{margin:12px 14px 0;padding:8px 12px;border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);font-size:13px}
details ul{list-style:none;padding:8px 14px 12px}
details li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
details li:last-child{border:0}
li.ok>span:first-child::before{content:"✓ ";color:var(--acc);font-weight:700}
li.none{color:var(--mute)}
li button,.mbtn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:5px 10px;font-size:12.5px;margin-left:6px}
li button:hover{border-color:var(--acc)}
dialog{width:min(900px,96vw);height:88dvh;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;margin:auto}
dialog::backdrop{background:#0008}
dialog[open]{display:flex;flex-direction:column}
.vh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
#vb{flex:1;display:grid;place-items:center;overflow:auto;padding:8px}
#vb iframe{width:100%;height:100%;border:0;background:#fff}
#vb img{max-width:100%;max-height:100%}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto}
  .grid2{grid-template-columns:1fr}
  summary{grid-template-columns:62px 1fr auto}
  details li{flex-direction:column;align-items:flex-start}
  li>span:last-child{margin-left:-6px}
}
.inp{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;margin-bottom:12px;width:100%;max-width:420px}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
.tools.o{padding:0 0 10px}
.mbtn{cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}
.mbtn.on{background:#ef4444;color:#fff;border-color:#ef4444}
details.na{opacity:.55}
.notes{padding:0 14px 14px;display:grid;gap:6px;justify-items:start}
.notes textarea,.rep{width:100%;min-height:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;font:inherit}
.rep{min-height:55dvh}
.drive{width:100%;height:34dvh;font:700 40px var(--f1);border:0;border-radius:20px;background:var(--acc);color:var(--on-acc);margin-bottom:12px}
.big2{font-size:22px;line-height:1.5}
.doc{width:100%;height:100%;overflow:auto;padding:16px;align-self:start;background:#fff;color:#111}
.doc table{border-collapse:collapse}.doc td,.doc th{border:1px solid #ccc;padding:4px 8px}
.imp{font-size:13px;margin-top:8px}
</style>
</head>

<div class="app">
  <aside class="rail">
    <div class="brand">SIGIA<small>Inocuidad alimentaria · SQF edición 10</small></div>
    <nav id="nav">

    </nav>
    <section class="asst" aria-label="Asistente">
      <h2>Pregunta a la norma</h2>
      <textarea id="q" placeholder="Escribe, pega o dicta. Ej.: ¿qué pide la cláusula 11.2.4?"></textarea>
      <div class="row">
        <button class="mic" id="mic" aria-label="Dictar pregunta">Dictar</button>
        <button class="btn pri" id="go">Preguntar</button>
        <label class="btn" for="ocr">Escanear (OCR)</label>
        <input type="file" id="ocr" accept="image/*" hidden>
      </div>
      <div id="st" role="status" aria-live="polite"></div>
      <div class="ans" id="ans" aria-live="polite"></div>
      <div class="row">
        <button class="btn" id="play">▶ Escuchar</button>
        <button class="btn" id="stop">■ Parar</button>
        <label style="font-size:12px"><input type="checkbox" id="auto" checked> Leer solo</label>
      </div>
      <div class="ctl">
        <span>Velocidad</span><input type="range" id="rate" min=".5" max="3" step=".25" value="1"><output id="ro">1x</output>
        <span>Volumen</span><input type="range" id="vol" min="0" max="1" step=".1" value="1"><output id="vo">100%</output>
      </div>
    </section>
    <p class="legal">Las respuestas del asistente son una guía basada en las normas y no sustituyen el juicio de un auditor certificado.</p>
  </aside>
  <main id="main"></main>
</div>

<dialog id="v">
  <div class="vh"><b id="vt"></b><span><a class="mbtn" id="vdl">Descargar copia</a><button class="mbtn" id="vdel">Eliminar</button><button class="mbtn" id="vx">Cerrar</button></span></div>
  <div id="vb"></div>
</dialog>

  reporte:()=>`<h1>Reporte</h1><p class="sub">Dicta, pega o escanea. Se guarda solo en este dispositivo.</p><div class="tools o"><button class="mbtn" data-act="dict" data-t="rep">🎙 Dictar</button><label class="mbtn" for="ocr2">📷 Escanear (OCR)</label><input type="file" id="ocr2" accept="image/*" hidden><button class="mbtn" data-act="readrep">🔊 Escuchar</button><button class="mbtn" data-act="copy">Copiar</button><button class="mbtn" data-act="word">Descargar Word</button><button class="mbtn" data-act="clear">Limpiar</button></div><textarea id="rep" class="rep" placeholder="Escribe o dicta tu reporte…">${esc(S.rep)}</textarea>`,
  manejo:()=>{navigator.wakeLock?.request('screen').catch(()=>{});return`<h1>Modo manejando</h1><p class="sub">Toca, pregunta y escucha sin mirar la pantalla.</p><button class="drive" data-act="mic">Preguntar</button><div class="tools o"><button class="mbtn" data-act="again">Repetir</button><button class="mbtn" data-act="stop">Parar</button>${[1,1.5,2,2.5,3].map(r=>`<button class="mbtn" data-rate="${r}">${r}x</button>`).join('')}</div><p id="bigtxt" class="big2">${esc(last)||'…'}</p>`}
};

/* ═══ ASISTENTE: búsqueda en la norma ═══ */
const STOP=new Set('de la el los las y en que un una del al se por con para es lo como me cual cuales necesito requiere pide piden clausula registros documentos norma sqf hay'.split(' '));
let last='';
const chunks=()=>[...ALL.map(c=>({k:'c',c,t:'SQF '+c.code+' · '+c.title,x:(c.regs.length?'Registros requeridos: '+c.regs.join('; ')+'.':'Sin registros definidos.')+(c.obs?' Observaciones: '+c.obs:'')+(c.regs.length?' Cargados '+cnt(c)+' de '+c.regs.length+'.':'')})),...LIB.map(([t,x,u])=>({k:'l',t,x,u})),...IMP.flatMap(d=>d.chunks.map(x=>({k:'d',t:'Tu documento · '+d.name,x})))];
function ask(q){
  q=q.trim();if(!q)return;const n=norm(q),all=chunks();let hits=[];
  const code=n.match(/\b\d{1,2}(?:\.\d{1,2}){0,3}\b/);
  if(code)hits=all.filter(h=>h.k==='c'?h.c.code===code[0]||h.c.code.startsWith(code[0]+'.'):h.k==='l'&&h.x.includes(code[0])).slice(0,8);
  if(!hits.length){
    const t=[...new Set(n.split(/\W+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.slice(0,5)))].slice(0,60),min=Math.min(3,t.length*3);
    hits=all.map(h=>{const a=norm(h.t),b=norm(h.x);return{h,s:t.reduce((x,w)=>x+(a.includes(w)?3:0)+(b.includes(w)?1:0),0)}}).filter(x=>x.s>=min&&x.s>0).sort((x,y)=>y.s-x.s).slice(0,6).map(x=>x.h);
  }
  last=hits.length?hits.map(h=>h.t+'. '+h.x).join(' '):'No encontré eso en la norma ni en la biblioteca. Prueba con un número de cláusula, por ejemplo 11.2.4, o con palabras como plagas, alérgenos o calibración.';
  $('#ans').innerHTML=hits.length?hits.map(h=>`<div><b>${h.t}</b><br>${h.x}<br>${h.k==='c'?`<button class="btn" data-go="${h.c.code}">Abrir cláusula</button>`:h.u?`<a class="btn" style="display:inline-block;margin-top:6px;color:#fff" href="${h.u}" target="_blank" rel="noopener">Fuente oficial</a>`:''}</div>`).join(''):`<div>${last}</div>`;
  const b=$('#bigtxt');if(b)b.textContent=last;
  if($('#auto').checked)say(last);
}
$('#go').onclick=()=>ask($('#q').value);
$('#q').onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))ask(e.target.value)};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
$('#mic').onclick=()=>{
  if(!SR)return say$('Este navegador no tiene dictado. Usa Chrome, Edge o Safari.');
  if(rec)return rec.stop();
  rec=new SR();rec.lang='es-MX';rec.interimResults=true;
  rec.onresult=e=>{$('#q').value=[...e.results].map(r=>r[0].transcript).join(' ')};
  rec.onend=()=>{rec=null;$('#mic').classList.remove('on');ask($('#q').value)};
  rec.onerror=e=>say$('No pude escuchar: '+e.error);
  $('#mic').classList.add('on');rec.start();
};
function say(t){
  if(!('speechSynthesis' in window)||!t)return;speechSynthesis.cancel();
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('es')),g=[];let b='';
  for(const p of t.match(/[^.;:!?]+[.;:!?]?\s*/g)||[t]){if((b+p).length>180&&b){g.push(b);b=''}b+=p}if(b)g.push(b);
  g.forEach(s=>{const u=new SpeechSynthesisUtterance(s);u.lang='es-MX';u.rate=+$('#rate').value;u.volume=+$('#vol').value;if(v)u.voice=v;speechSynthesis.speak(u)});
}
$('#play').onclick=()=>say(last);
$('#stop').onclick=()=>speechSynthesis.cancel();
$('#rate').oninput=e=>{$('#ro').textContent=e.target.value+'x';if(speechSynthesis.speaking)say(last)};
$('#vol').oninput=e=>{$('#vo').textContent=Math.round(e.target.value*100)+'%';if(speechSynthesis.speaking)say(last)};

/* ═══ DICTADO CONTINUO (notas y reporte) ═══ */
let dr=null;
function dict(el,btn){
  if(dr)return dr.stop();if(!SR||!el)return say$('Este navegador no tiene dictado. Usa Chrome, Edge o Safari.');
  dr=new SR();dr.lang='es-MX';dr.continuous=true;
  dr.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){el.value+=(el.value&&!/\s$/.test(el.value)?' ':'')+e.results[i][0].transcript.trim();el.dispatchEvent(new Event('input',{bubbles:true}))}};
  dr.onend=()=>{dr=null;btn.classList.remove('on');btn.textContent=btn.dataset.l};dr.onerror=e=>say$('No pude escuchar: '+e.error);
  btn.dataset.l=btn.textContent;btn.classList.add('on');btn.textContent='■ Detener';dr.start();
}
const ocrText=async f=>{await loadOCR();return(await Tesseract.recognize(f,'spa')).data.text.trim()};
const chunk=t=>{const o=[];let b='';for(const p of t.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/)){if(b.length+p.length>500&&b){o.push(b);b=''}b+=(b?' ':'')+p}if(b)o.push(b);return o.filter(x=>x.length>20)};
async function imp(f){
  say$('Importando…');
  try{
    const n=f.name.toLowerCase();let t='';
    if(n.endsWith('.pdf')){await load(PDF+'pdf.min.js',()=>window.pdfjsLib);pdfjsLib.GlobalWorkerOptions.workerSrc=PDF+'pdf.worker.min.js';const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=d.numPages;i++)t+=(await(await d.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')+' '}
    else if(n.endsWith('.docx')){await load(MAM,()=>window.mammoth);t=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
    else if(n.endsWith('.xlsx')){await load(XL,()=>window.XLSX);const w=XLSX.read(await f.arrayBuffer());t=w.SheetNames.map(s=>XLSX.utils.sheet_to_csv(w.Sheets[s])).join('. ')}
    else if(/\.html?$/.test(n))t=new DOMParser().parseFromString(await f.text(),'text/html').body.textContent;
    else t=await f.text();
    const ch=chunk(t);if(!ch.length)throw 0;const d={id:'doc:'+Date.now(),name:f.name,chunks:ch};await fPut(d.id,d);IMP.push(d);route();say$('Importado: '+ch.length+' fragmentos. Ya puedes preguntarle.');
  }catch{say$('No pude leer ese archivo. Un PDF escaneado necesita OCR primero.')}
}
document.addEventListener('change',async e=>{
  const i=e.target,f=i.files?.[0];if(!f)return;
  if(i.id==='imp')await imp(f);
  if(i.id==='ocr2'){say$('Leyendo imagen…');try{const t=await ocrText(f);const r=$('#rep');r.value+=(r.value?'\n\n':'')+t;S.rep=r.value;save();say$('Texto agregado al reporte.')}catch{say$('No pude leer la imagen.')}}
  i.value='';
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.note){S.notes[t.dataset.note]=t.value;save()}else if(t.id==='rep'){S.rep=t.value;save()}else if(t.id==='co'){S.co=t.value;save()}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act],[data-rate]');if(!b)return;const a=b.dataset.act,c=b.dataset.code;
  if(b.dataset.rate){$('#rate').value=b.dataset.rate;$('#rate').oninput({target:$('#rate')});return}
  if(a==='mic')$('#mic').click();
  else if(a==='again')say(last);
  else if(a==='stop')speechSynthesis.cancel();
  else if(a==='read'){const k=ALL.find(x=>x.code===c);last=`Cláusula ${k.code}, ${k.title}. `+(k.regs.length?'Registros requeridos: '+k.regs.join('; ')+'.':'Sin registros definidos.')+(k.obs?' Observaciones: '+k.obs:'');say(last)}
  else if(a==='lib'){const l=LIB[b.dataset.i];last=l[0]+'. '+l[1];say(last)}
  else if(a==='na'){S.na[c]=S.na[c]?0:1;save();openC=c;route()}
  else if(a==='dict')dict(document.getElementById(b.dataset.t),b);
  else if(a==='readrep')say($('#rep').value);
  else if(a==='copy'){try{await navigator.clipboard.writeText($('#rep').value);say$('Copiado.')}catch{say$('No pude copiar.')}}
  else if(a==='word'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['<html><head><meta charset="utf-8"></head><body>'+esc($('#rep').value).replace(/\n/g,'<br>')+'</body></html>'],{type:'application/msword'}));l.download='reporte.doc';l.click()}
  else if(a==='clear'){if(confirm('¿Borrar el reporte?')){S.rep='';save();route()}}
  else if(a==='deldoc'){await fDel(b.dataset.id);IMP=IMP.filter(d=>d.id!==b.dataset.id);route()}
});

/* ═══ OCR (Tesseract.js, se carga solo al usarlo) ═══
const loadOCR=()=>window.Tesseract?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=ko;document.head.append(s)});
$('#ocr').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;say$('Leyendo imagen…');
  try{await loadOCR();const{data:{text}}=await Tesseract.recognize(f,'spa');$('#q').value=text.trim().slice(0,600);say$('Texto leído. Buscando la cláusula.');ask(text)}
  catch{say$('No pude leer la imagen. Revisa tu conexión e inténtalo de nuevo.')}
  e.target.value='';
};

/* ═══ ARRANQUE ═══ */
fKeys().then(async k=>{const d=x=>String(x).startsWith('doc:');have=new Set(k.filter(x=>!d(x)));for(const x of k.filter(d))IMP.push(await fGet(x));route()}).catch(route);
</script>
